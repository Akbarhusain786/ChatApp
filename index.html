<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= device-width,
    initial-scale=1.0">
    <title>ChatApp</title>
    <link href="style.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"
        integrity="sha384-oqVuAfXRKap7fdgcCY5uykM6+R9GqQ8K/uxy9rx7HNQlGYl1kPzQho1wx4JwY8wC" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

</head>

<body>
    <main>
        <form class="form-join">
            <input type="text" id="name" maxlength="8" placeholder="Enter your name" size="5" required>
            <input type="text" id="room" placeholder="Chat room size" size="5" required>
            <button id="join" type="submit">join</button>
        </form>
        <ul class="Chat-display"></ul>
        <p class="user-list"></p>
        <p class="room-list"></p>
        <p class="activity"></p>
        <form class="form-msg">
            <input type="text" id="message" placeholder="type your message from here" required>
            <button type="submit">Send</button>
        </form>

        <p class="activity"></p>
    </main>
</body>

</html>
